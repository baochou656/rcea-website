[rceca]
user = www
group = www
listen = /run/php/php8.3-fpm-rceca.sock
listen.owner = www
listen.group = www
listen.mode = 0660
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 15s
pm.max_requests = 500
catch_workers_output = yes
security.limit_extensions = .php

env[RCECA_CMS_DATA_DIR] = /www/server/rceca-cms/data
env[RCECA_UPLOAD_DIR] = /www/wwwroot/rceca.org/uploads

php_admin_value[open_basedir] = /www/wwwroot/rceca.org/:/www/server/rceca-cms/:/tmp/
php_admin_value[upload_tmp_dir] = /www/server/rceca-cms/tmp
php_admin_value[session.save_path] = /www/server/rceca-cms/sessions
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 22M
php_admin_value[max_execution_time] = 60
php_admin_value[max_input_vars] = 2000
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /www/wwwlogs/rceca.org.php.error.log
