server
{
    listen 80;
    listen 443 ssl http2;
    server_name rceca.org www.rceca.org;
    index index.php index.html index.htm default.htm default.html;
    root /www/wwwroot/rceca.org;
    client_max_body_size 22m;

    include /www/server/panel/vhost/nginx/extension/rceca.org/*.conf;
    include /www/server/panel/vhost/nginx/well-known/rceca.org.conf;

    ssl_certificate /www/server/panel/vhost/cert/rceca.org/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/rceca.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    error_page 497 https://$host$request_uri;

    include /www/server/panel/vhost/rewrite/html_rceca.org.conf;

    location ^~ /cms/ { return 404; }
    location ^~ /bin/ { return 404; }
    location ^~ /deploy/ { return 404; }
    location ^~ /var/ { return 404; }
    location ~* ^/uploads/.*\.(php|phtml|pht|phar)$ { return 404; }

    location ~ ^/members/([a-z0-9]+(?:-[a-z0-9]+)*)\.html$ {
        try_files $uri /members/profile.php?slug=$1;
    }

    location ~ ^/admin/.*\.php$ {
        if ($scheme = http) { return 301 https://$host$request_uri; }
        try_files $uri =404;
        include /www/server/nginx/conf/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.3-fpm-rceca.sock;
        fastcgi_read_timeout 65s;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include /www/server/nginx/conf/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.3-fpm-rceca.sock;
        fastcgi_read_timeout 65s;
    }

    location ~* (\.user\.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$ { return 404; }
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ { return 404; }

    location ~ \.well-known { allow all; }
    if ($uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$") { return 403; }
    location ~* \.(gif|jpg|jpeg|png|bmp|swf|webp)$ { expires 30d; access_log off; }
    location ~* \.(js|css)$ { expires 12h; access_log off; }

    access_log /www/wwwlogs/rceca.org.log;
    error_log /www/wwwlogs/rceca.org.error.log;
}
